name: Deploy Lambda Functions

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy registerForEvent
        run: |
          cd functions/registerForEvent
          zip function.zip lambda_function.py
          aws lambda update-function-code --function-name registerForEvent --zip-file fileb://function.zip

      - name: Deploy listEvents
        run: |
          cd functions/listEvents
          zip function.zip lambda_function.py
          aws lambda update-function-code --function-name listEvents --zip-file fileb://function.zip

      - name: Deploy getEventById
        run: |
          cd functions/getEventById
          zip function.zip lambda_function.py
          aws lambda update-function-code --function-name getEventById --zip-file fileb://function.zip