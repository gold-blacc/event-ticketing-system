<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Event Ticketing Portal</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #18030a 0%, #2b0914 50%, #120208 100%);
      --card-bg: rgba(45, 12, 24, 0.65);
      --card-border: rgba(226, 177, 112, 0.25);
      --text-main: #fdf8f5;
      --text-muted: #d4a8b3;
      --accent-gold: linear-gradient(135deg, #f3d09a 0%, #e2b170 100%);
      --accent-gold-solid: #e2b170;
      --accent-hover: #f3d09a;
      --wine-glow: rgba(219, 39, 119, 0.2);
      --success-color: #34d399;
      --error-color: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: var(--accent-gold);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      text-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
    }

    .container {
      width: 100%;
      max-width: 750px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 30px var(--wine-glow);
    }

    .card h2 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--accent-gold-solid);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .event-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
    }

    .detail-item .label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
    }

    .detail-item .value {
      font-size: 1.15rem;
      font-weight: 700;
      margin-top: 6px;
      color: var(--text-main);
    }

    .progress-bar-bg {
      background-color: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      height: 8px;
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(226, 177, 112, 0.15);
    }

    .progress-bar-fill {
      background: var(--accent-gold);
      height: 100%;
      width: 0%;
      transition: width 0.5s ease;
      box-shadow: 0 0 12px rgba(226, 177, 112, 0.6);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    input {
      background-color: rgba(15, 3, 10, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 16px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--accent-gold-solid);
      box-shadow: 0 0 15px rgba(226, 177, 112, 0.25);
    }

    button {
      background: var(--accent-gold);
      color: #1a040b;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(226, 177, 112, 0.35);
    }

    #message {
      padding: 16px;
      border-radius: 10px;
      display: none;
      font-size: 0.95rem;
      margin-top: 12px;
      text-align: center;
      font-weight: 600;
    }

    #message.success {
      background-color: rgba(52, 211, 153, 0.12);
      border: 1px solid var(--success-color);
      color: var(--success-color);
      display: block;
    }

    #message.error {
      background-color: rgba(248, 113, 113, 0.12);
      border: 1px solid var(--error-color);
      color: var(--error-color);
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <h1>Event Ticketing Portal</h1>
    <p>Serverless Luxury Access</p>
  </header>

  <div class="container">
    <div class="card" id="eventCard">
      <h2 id="eventName">Loading Event...</h2>
      <div class="event-details">
        <div class="detail-item">
          <span class="label">Event ID</span>
          <span class="value" id="eventId">-</span>
        </div>
        <div class="detail-item">
          <span class="label">Date</span>
          <span class="value" id="eventDate">-</span>
        </div>
        <div class="detail-item">
          <span class="label">Status</span>
          <span class="value" id="eventStatus">-</span>
        </div>
        <div class="detail-item">
          <span class="label">Seats Reserved</span>
          <span class="value" id="eventCapacity">-</span>
        </div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="card">
      <h2>Reserve Pass</h2>
      <form id="registrationForm">
        <div class="form-group">
          <label for="userName">Full Name</label>
          <input type="text" id="userName" placeholder="Enter guest name" required>
        </div>
        <button type="submit" id="submitBtn">Confirm Reservation</button>
      </form>
      <div id="message"></div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://adqrmc34qb.execute-api.us-east-1.amazonaws.com/prod';
    const EVENT_ID = 'evt001';

    async function fetchEventDetails() {
      try {
        const response = await fetch(`${API_BASE_URL}/events/${EVENT_ID}`);
        if (!response.ok) throw new Error('Failed to fetch event data');
        const event = await response.json();

        document.getElementById('eventName').textContent = event.eventName || 'AWS Workshop Accra 2026';
        document.getElementById('eventId').textContent = event.eventId;
        document.getElementById('eventDate').textContent = event.date;
        document.getElementById('eventStatus').textContent = event.status;
        document.getElementById('eventCapacity').textContent = `${event.registered} / ${event.capacity}`;

        const percentage = Math.min(100, (event.registered / event.capacity) * 100);
        document.getElementById('progressFill').style.width = `${percentage}%`;
      } catch (err) {
        console.error(err);
        document.getElementById('eventName').textContent = 'Error loading event details';
      }
    }

    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const userName = document.getElementById('userName').value.trim();
      const messageDiv = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');

      if (!userName) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Processing Reservation...';
      messageDiv.className = '';
      messageDiv.style.display = 'none';

      try {
        const response = await fetch(`${API_BASE_URL}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ eventId: EVENT_ID, userName: userName })
        });

        const result = await response.json();

        if (response.ok) {
          messageDiv.className = 'success';
          messageDiv.textContent = `Reservation Confirmed. Access Pass ID: ${result.registration.registrationId}`;
          document.getElementById('userName').value = '';
          fetchEventDetails();
        } else {
          messageDiv.className = 'error';
          messageDiv.textContent = result.message || 'Registration failed.';
        }
      } catch (err) {
        messageDiv.className = 'error';
        messageDiv.textContent = 'Network error. Please try again later.';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Confirm Reservation';
      }
    });

    fetchEventDetails();
  </script>
</body>
</html>
